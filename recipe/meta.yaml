{% set name = "bluesky-queueserver-api" %}
{% set version = "0.0.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e6d1db59acc76dd911b97e69dbdd8eef9258e1c37a72bfdfc4ca01bc33134766

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - bluesky-queueserver
    - httpx
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - bluesky_queueserver_api

about:
  home: https://github.com/bluesky/bluesky-queueserver-api
  summary: Python API for Bluesky Queue Server
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://blueskyproject.io/bluesky-queueserver-api
  dev_url: https://github.com/bluesky/bluesky-queueserver-api

extra:
  recipe-maintainers:
    - dmgav
    - mrakitin
